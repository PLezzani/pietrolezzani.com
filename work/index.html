<!DOCTYPE html>
<html lang="en-US">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Work, Pietro Lezzani</title>
	<meta name="description" content="The work now lives on the homepage, with one page for each case." />
	<!--
		Questa pagina esisteva nel sito vecchio ed e' indicizzata. GitHub Pages non
		puo' emettere un 301, quindi il rimando e' un refresh immediato piu' il
		canonical alla home: chi arriva da un vecchio link o da una ricerca finisce
		dove il lavoro sta adesso, e i motori seguono il canonical invece di tenere
		in indice una pagina che non ha piu' contenuto.
	-->
	<meta http-equiv="refresh" content="0; url=/#work" />
	<link rel="canonical" href="https://pietrolezzani.com/" />
	<meta name="robots" content="noindex, follow" />

	<link rel="icon" href="/wp-content/uploads/2024/09/Favicon_PietroLezzani-150x150.png" sizes="32x32" />
	<link rel="apple-touch-icon" href="/wp-content/uploads/2024/09/Favicon_PietroLezzani-300x300.png" />

	<link rel="preload" href="/assets/fonts/darker-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
	<link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>
	<main id="main">
		<section class="section">
			<div class="container">
				<h1 class="display-l">The work moved</h1>
				<p class="body-l measure muted" style="margin-top: var(--space-md)">Three decisions and what came of them are on the homepage now, with a page for each. You are being taken there.</p>
				<p style="margin-top: var(--space-xl)"><a class="btn btn-primary" href="/#work">See the work</a></p>
			</div>
		</section>
	</main>
	<script src="/assets/js/button-fill.js" defer></script>
</body>
</html>
